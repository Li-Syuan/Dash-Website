name: Reporting foundation tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the approved minimal runtime subset
        run: python -m pip install -r requirements-demo.txt
      - name: Run isolated regression and concurrency tests
        run: python -B -m unittest discover -s tests -v
      - name: Check whitespace errors
        run: git diff --check
