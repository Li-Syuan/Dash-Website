name: Reporting foundation tests
on:
  push:
    branches: [main, 'validation/dash-handoff-*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the approved minimal runtime subset
        run: python -m pip install -r requirements-qa-portal.txt
      - name: Run isolated regression and concurrency tests
        run: |
          mkdir -p output/ci
          python -B tests/probes/clock_guard.py --output output/ci/clock.jsonl -- python -B -m unittest discover -s tests -v
      - name: Check whitespace errors
        run: git diff --check

  browser:
    name: Synthetic browser acceptance (50 scenarios)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install the approved Python subset and fixed browser test driver
        run: |
          python -m pip install -r requirements-qa-portal.txt
          npm install --prefix "$RUNNER_TEMP/qa-browser" --no-save --ignore-scripts playwright@1.62.1
          echo "QA_PLAYWRIGHT_MODULE=$RUNNER_TEMP/qa-browser/node_modules/playwright" >> "$GITHUB_ENV"
          echo "QA_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          node --version
          google-chrome --version
      - name: Validate the fail-closed acceptance gate
        run: node tests/js/browser_acceptance_gate.cjs
      - name: Exercise both reports through the same app.py in native Chrome
        id: browser
        env:
          QA_REPORT_TEMPLATE: '1'
          QA_QUALITY_ACTIONS: '1'
          QA_STATIC_BRIDGE: '0'
          QA_HTTP10: '0'
          QA_BROWSER_CHANNEL: chrome
        run: node tests/browser/acceptance.cjs
      - name: Require all 50 scenarios and matching current sources
        if: ${{ always() && steps.browser.outcome != 'skipped' }}
        run: node tests/browser/verify_acceptance.cjs
      - name: Preserve synthetic acceptance evidence without raw logs or state
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-browser-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/playwright/quality-actions/**/ci-acceptance.json
            output/playwright/quality-actions/**/source-hashes.json
            output/playwright/quality-actions/**/harness-hashes.json
            output/playwright/quality-actions/**/runtime-hashes.json
            output/playwright/quality-actions/**/*.png
